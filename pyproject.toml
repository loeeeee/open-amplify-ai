[project]
name = "open-amplify-ai"
version = "0.0.1"
description = "OpenAI-compatible wrapper for Amplify AI API"
readme = "README.md"
authors = [
    { name = "loeeeee", email = "95266635+loeeeee@users.noreply.github.com" }
]
requires-python = ">=3.13"
dependencies = [
    "python-dotenv>=1.1.1",
    "requests>=2.32.5",
    "httpx>=0.28.1",
    "fastapi>=0.115.0",
    "uvicorn>=0.34.0",
    "tqdm>=4.67.1",
    "pypdf>=6.10.1",
    "python-multipart>=0.0.26",
]


[project.scripts]
amplify = "open_amplify_ai.cli:main"

[build-system]
requires = ["uv_build>=0.9.7"]
build-backend = "uv_build"


[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.0.3",
    "pytest-mock>=3.15.1",
]
